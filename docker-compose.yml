version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postify-db
    environment:
      POSTGRES_DB: postify
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postify-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postify"]
      interval: 10s
      timeout: 5s
      retries: 5

  postify-app:
    build: .
    container_name: postify-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED}

      SPRING_LOGGING_LEVEL_ROOT: ${SPRING_LOGGING_LEVEL_ROOT}
      SPRING_LOGGING_LEVEL_RU_JADEGG2568_POSTIFY: ${SPRING_LOGGING_LEVEL_APP}

      POSTIFY_SESSION_SECRETKEY: ${POSTIFY_SESSION_SECRETKEY}
      POSTIFY_SESSION_EXPIRATION: ${POSTIFY_SESSION_EXPIRATION}
      POSTIFY_SESSION_REFRESHEXPIRATION: ${POSTIFY_SESSION_REFRESH_EXPIRATION}
      POSTIFY_SESSION_EXPIREDDELETING_DELAY: ${POSTIFY_SESSION_EXPIRED_DELETING_DELAY}
      POSTIFY_SESSION_EXPIREDDELETING_COUNT: ${POSTIFY_SESSION_EXPIRED_DELETING_COUNT}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postify-net

volumes:
  postgres-data:

networks:
  postify-net:
    driver: bridge