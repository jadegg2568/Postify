version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postify-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postify-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postify-app:
    build: .
    container_name: postify-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      POSTIFY_SESSION_SECRETKEY: ${SESSION_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postify-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: postify-nginx
    ports:
      - "80:80" # main
      - "443:443" # ssl
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # ssl files
    networks:
      - postify-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  postify-network:
    driver: bridge