server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: Postify

  devtools:
    restart:
      enabled: true

  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL:10}
      pool-name: PostifyHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

logging:
  level:
    root: ${SPRING_LOGGING_LEVEL_ROOT:INFO}
    ru.jadegg2568.Postify: ${SPRING_LOGGING_LEVEL_APP:DEBUG}

minio:
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${OBJECT_STORAGE_USER:minioadmin}
  secret-key: ${OBJECT_STORAGE_PASSWORD:minioadmin123}
  bucket: ${OBJECT_STORAGE_BUCKET:postify-files}

app:
  session:
    secretKey: ${APP_SESSION_SECRET_KEY}

    expiration: ${APP_SESSION_EXPIRATION:1h}
    refreshExpiration: ${APP_SESSION_REFRESH_EXPIRATION:30d}

    cleanup:
      delay: ${APP_SESSION_CLEANUP_DELAY:5m}
      suze: ${APP_SESSION_CLEANUP_COUNT:10000}
  views:
    expiration: ${APP_VIEWS_EXPIRATION:24h}
    cleanup:
      delay: ${APP_VIEWS_CLEANUP_DELAY:1h}
      size: ${APP_VIEWS_CLEANUP_SIZE:10000}
